# GPU support for k3s: a RuntimeClass that selects the NVIDIA container runtime
# (k3s registers it automatically when nvidia-container-toolkit is installed
# before k3s starts) and the NVIDIA device plugin so pods can request
# nvidia.com/gpu. GPU pods must set runtimeClassName: nvidia (setup.sh does).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels: {name: nvidia-device-plugin}
  template:
    metadata:
      labels: {name: nvidia-device-plugin}
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
          env:
            - {name: FAIL_ON_INIT_ERROR, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
