# Least privilege: the controller only needs to read pods and patch their metadata.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cache-aware-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cache-aware-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/proxy"]        # only used when SCRAPE_MODE=proxy
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cache-aware-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cache-aware-controller
subjects:
  - kind: ServiceAccount
    name: cache-aware-controller
