# The controller running in the cluster, next to the pods it scores.
# Settings are environment variables; see cacheaware/controller.py Settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-aware-controller
  labels: {app: cache-aware-controller}
spec:
  replicas: 1
  strategy: {type: Recreate}         # never two controllers patching at once
  selector:
    matchLabels: {app: cache-aware-controller}
  template:
    metadata:
      labels: {app: cache-aware-controller}
    spec:
      serviceAccountName: cache-aware-controller
      containers:
        - name: controller
          image: cache-aware-controller:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: SELECTOR,     value: "app=vllm"}
            - {name: INTERVAL,     value: "5"}
            - {name: METRICS_PORT, value: "8000"}
            - {name: SCRAPE_MODE,  value: "direct"}   # in-cluster: talk to pod IPs
            - {name: W_HIT,        value: "0.7"}
            - {name: W_USAGE,      value: "0.3"}
            - {name: MIN_DELTA,    value: "25"}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
